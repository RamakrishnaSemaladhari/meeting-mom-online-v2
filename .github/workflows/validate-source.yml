name: Validate Meeting MoM V2 source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python sources
        run: python -m py_compile src/processor.py src/finalize.py src/drive.py
      - name: Check Apps Script JavaScript syntax
        run: cp google-apps-script/Code.gs /tmp/Code.js && node --check /tmp/Code.js
