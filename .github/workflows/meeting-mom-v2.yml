name: Meeting MoM Online V2

on:
  repository_dispatch:
    types: [meeting-ready]
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Optional test payload JSON"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: meeting-mom-v2-${{ github.event.client_payload.meeting_id || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Build payload
        env:
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python - <<'PY'
          import json,os
          raw=os.environ.get("MANUAL_PAYLOAD") or os.environ.get("EVENT_PAYLOAD") or "{}"
          p=json.loads(raw)
          if not p.get("meeting_id") or not p.get("audio_file_id"):
              raise SystemExit("meeting_id and audio_file_id are required")
          open("payload.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False,indent=2))
          PY
      - name: Notify Control Tower — queued
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
          MMV2_CALLBACK_SECRET: ${{ secrets.MMV2_CALLBACK_SECRET }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          p={"action":"processing_event","callback_secret":os.environ.get("MMV2_CALLBACK_SECRET",""),"meeting_id":json.loads(os.environ.get("MANUAL_PAYLOAD") or os.environ.get("EVENT_PAYLOAD") or "{}").get("meeting_id",""),"event":"WORKFLOW_STARTED","stage":"PREPARE","progress_percent":8,"status":"PROCESSING","message":"GitHub Actions workflow started."}
          url=os.environ.get("MMV2_GATEWAY_URL","")
          if url:
              try:
                  req=urllib.request.Request(url,data=json.dumps(p).encode(),headers={"Content-Type":"application/json"})
                  urllib.request.urlopen(req,timeout=20).read()
              except Exception as e: print("callback warning:",e)
          PY
      - name: Download source audio from Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from src.drive import DriveClient
          p=json.load(open("payload.json")); d=DriveClient()
          meta=d.download(p["audio_file_id"],"source_audio")
          p["audio_name"]=meta.get("name","meeting_audio")
          parent=p.get("meeting_folder_id") or p.get("audio_folder_id")
          temp=d.create_folder("MMV2-TEMP-"+p["meeting_id"],parent)
          p["chunk_folder_id"]=temp["id"]
          open("payload.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False,indent=2))
          PY
      - name: Notify Control Tower — audio downloaded
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
          MMV2_CALLBACK_SECRET: ${{ secrets.MMV2_CALLBACK_SECRET }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          p={"action":"processing_event","callback_secret":os.environ.get("MMV2_CALLBACK_SECRET",""),"meeting_id":json.loads(os.environ.get("MANUAL_PAYLOAD") or os.environ.get("EVENT_PAYLOAD") or "{}").get("meeting_id",""),"event":"AUDIO_DOWNLOADED","stage":"AUDIO_PREPARATION","progress_percent":15,"status":"PROCESSING","message":"Source audio downloaded from Google Drive."}
          url=os.environ.get("MMV2_GATEWAY_URL","")
          if url:
              try:
                  req=urllib.request.Request(url,data=json.dumps(p).encode(),headers={"Content-Type":"application/json"})
                  urllib.request.urlopen(req,timeout=20).read()
              except Exception as e: print("callback warning:",e)
          PY

      - name: Split into approximately 10-minute chunks
        run: |
          mkdir -p chunks
          ffmpeg -hide_banner -loglevel error -i source_audio -f segment -segment_time 600 -reset_timestamps 1 -c:a aac -b:a 64k chunks/chunk_%04d.m4a
          test "$(find chunks -name 'chunk_*.m4a' | wc -l)" -gt 0
      - name: Upload temporary chunks to Drive and create matrix
        id: matrix
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json,glob,os
          from src.drive import DriveClient
          p=json.load(open("payload.json")); d=DriveClient(); items=[]
          for i,f in enumerate(sorted(glob.glob("chunks/chunk_*.m4a"))):
              meta=d.upload(f,f"MMV2-{p['meeting_id']}-chunk-{i:04d}.m4a",p["chunk_folder_id"],"audio/mp4")
              items.append({"index":i,"file_id":meta["id"]})
          p["chunk_file_ids"]=[x["file_id"] for x in items]
          open("payload.json","w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False,indent=2))
          open("matrix.json","w").write(json.dumps({"include":items},separators=(",",":")))
          PY
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
      - name: Notify Control Tower — chunks prepared
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
          MMV2_CALLBACK_SECRET: ${{ secrets.MMV2_CALLBACK_SECRET }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          p=json.load(open("payload.json"))
          p.update({"action":"processing_event","callback_secret":os.environ.get("MMV2_CALLBACK_SECRET",""),"event":"CHUNKS_PREPARED","stage":"CHUNK_PREPARATION","progress_percent":25,"status":"PROCESSING","message":"Audio split and temporary chunks uploaded.","chunk_count":len(p.get("chunk_file_ids",[]))})
          url=os.environ.get("MMV2_GATEWAY_URL","")
          if url:
              try:
                  req=urllib.request.Request(url,data=json.dumps(p).encode(),headers={"Content-Type":"application/json"})
                  urllib.request.urlopen(req,timeout=20).read()
              except Exception as e: print("callback warning:",e)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ github.run_id }}
          path: payload.json
          retention-days: 1

  process-chunks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download this 10-minute chunk from Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          CHUNK_ID: ${{ matrix.file_id }}
        run: |
          python - <<'PY'
          import os
          from src.drive import DriveClient
          DriveClient().download(os.environ["CHUNK_ID"],"chunk.m4a")
          PY
      - name: Notify Control Tower — chunk processing
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
          MMV2_CALLBACK_SECRET: ${{ secrets.MMV2_CALLBACK_SECRET }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
          CHUNK_INDEX: ${{ matrix.index }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          p={"action":"processing_event","callback_secret":os.environ.get("MMV2_CALLBACK_SECRET",""),"meeting_id":json.loads(os.environ.get("MANUAL_PAYLOAD") or os.environ.get("EVENT_PAYLOAD") or "{}").get("meeting_id",""),"event":"CHUNK_PROCESSING","stage":"WHISPER","progress_percent":40,"status":"PROCESSING","chunk_no":os.environ.get("CHUNK_INDEX",""),"message":"Whisper processing started for chunk "+os.environ.get("CHUNK_INDEX","")}
          url=os.environ.get("MMV2_GATEWAY_URL","")
          if url:
              try:
                  req=urllib.request.Request(url,data=json.dumps(p).encode(),headers={"Content-Type":"application/json"})
                  urllib.request.urlopen(req,timeout=20).read()
              except Exception as e: print("callback warning:",e)
          PY
      - name: Process chunk
        env:
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
          WHISPER_COMPUTE: int8
        run: |
          mkdir -p result
          python src/processor.py --audio chunk.m4a --index "${{ matrix.index }}" --out result
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.index }}-${{ github.run_id }}
          path: result/
          retention-days: 1

  finalize:
    needs: [prepare, process-chunks]
    if: ${{ always() && needs.prepare.result == 'success' && needs.process-chunks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download prepared payload
        uses: actions/download-artifact@v4
        with:
          name: prepared-${{ github.run_id }}
          path: prepared
      - name: Download all chunk results
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*-${{ github.run_id }}
          path: result
          merge-multiple: true
      - name: Notify Control Tower — chunks completed
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
          MMV2_CALLBACK_SECRET: ${{ secrets.MMV2_CALLBACK_SECRET }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          p={"action":"processing_event","callback_secret":os.environ.get("MMV2_CALLBACK_SECRET",""),"meeting_id":json.loads(os.environ.get("MANUAL_PAYLOAD") or os.environ.get("EVENT_PAYLOAD") or "{}").get("meeting_id",""),"event":"CHUNKS_COMPLETED","stage":"FINALIZATION","progress_percent":75,"status":"PROCESSING","message":"All Whisper chunk jobs completed. Starting finalization."}
          url=os.environ.get("MMV2_GATEWAY_URL","")
          if url:
              try:
                  req=urllib.request.Request(url,data=json.dumps(p).encode(),headers={"Content-Type":"application/json"})
                  urllib.request.urlopen(req,timeout=20).read()
              except Exception as e: print("callback warning:",e)
          PY

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 2; done
          ollama pull "${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}"
      - name: Synthesize, upload and clean temporary chunks
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
          MMV2_CALLBACK_SECRET: ${{ secrets.MMV2_CALLBACK_SECRET }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/finalize.py --payload prepared/payload.json --out result
      - name: Notify Control Tower — finalization complete
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
          MMV2_CALLBACK_SECRET: ${{ secrets.MMV2_CALLBACK_SECRET }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          p={"action":"processing_event","callback_secret":os.environ.get("MMV2_CALLBACK_SECRET",""),"meeting_id":json.loads(os.environ.get("MANUAL_PAYLOAD") or os.environ.get("EVENT_PAYLOAD") or "{}").get("meeting_id",""),"event":"FINALIZATION_COMPLETE","stage":"FINALIZATION","progress_percent":95,"status":"PROCESSING","message":"Final MoM generation and Drive upload completed."}
          url=os.environ.get("MMV2_GATEWAY_URL","")
          if url:
              try:
                  req=urllib.request.Request(url,data=json.dumps(p).encode(),headers={"Content-Type":"application/json"})
                  urllib.request.urlopen(req,timeout=20).read()
              except Exception as e: print("callback warning:",e)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: meeting-mom-v2-output-${{ github.run_id }}
          path: result/
          retention-days: 1

  report-failure:
    needs: [prepare, process-chunks, finalize]
    if: ${{ always() && (needs.prepare.result == 'failure' || needs.process-chunks.result == 'failure' || needs.finalize.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
          MMV2_CALLBACK_SECRET: ${{ secrets.MMV2_CALLBACK_SECRET }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          p={"action":"fail_meeting","callback_secret":os.environ.get("MMV2_CALLBACK_SECRET",""),"meeting_id":json.loads(os.environ.get("MANUAL_PAYLOAD") or os.environ.get("EVENT_PAYLOAD") or "{}").get("meeting_id",""),"error_code":"GITHUB_PROCESSING_FAILED","error_message":"One or more V2 processing stages failed."}
          url=os.environ.get("MMV2_GATEWAY_URL","")
          if url and p["meeting_id"]:
              try:
                  req=urllib.request.Request(url,data=json.dumps(p).encode(),headers={"Content-Type":"application/json"})
                  urllib.request.urlopen(req,timeout=20).read()
              except Exception as e: print("callback warning:",e)
          PY
