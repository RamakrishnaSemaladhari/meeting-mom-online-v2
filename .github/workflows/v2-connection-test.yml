name: V2 Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Test dedicated V2 Google OAuth and Drive credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.MMV2_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.MMV2_GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.MMV2_GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          names = ["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REFRESH_TOKEN"]
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing V2 repository secrets: " + ", ".join(
                  "MMV2_GOOGLE_OAUTH_" + {
                      "GOOGLE_CLIENT_ID": "CLIENT_ID",
                      "GOOGLE_CLIENT_SECRET": "CLIENT_SECRET",
                      "GOOGLE_REFRESH_TOKEN": "REFRESH_TOKEN",
                  }[name] for name in missing
              ))

          response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": os.environ["GOOGLE_CLIENT_ID"],
                  "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
                  "refresh_token": os.environ["GOOGLE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              },
              timeout=45,
          )
          if not response.ok:
              try:
                  body = response.json()
              except ValueError:
                  body = {}
              code = str(body.get("error", "unknown_error"))
              description = str(body.get("error_description", ""))[:250]
              raise SystemExit(
                  f"GOOGLE_OAUTH: FAIL (HTTP {response.status_code}; "
                  f"error={code}; description={description})"
              )

          access_token = response.json().get("access_token")
          if not access_token:
              raise SystemExit("GOOGLE_OAUTH: FAIL (no access token in response)")

          drive = requests.get(
              "https://www.googleapis.com/drive/v3/files",
              params={"pageSize": 1, "fields": "files(id,mimeType)"},
              headers={"Authorization": "Bearer " + access_token},
              timeout=45,
          )
          if not drive.ok:
              try:
                  body = drive.json()
              except ValueError:
                  body = {}
              error = body.get("error", {})
              message = str(error.get("message", "Drive API request failed"))[:250] if isinstance(error, dict) else "Drive API request failed"
              raise SystemExit(
                  f"GOOGLE_DRIVE: FAIL (HTTP {drive.status_code}; {message})"
              )

          print("GOOGLE_OAUTH_REFRESH: PASS")
          print("GOOGLE_DRIVE_API_LIST: PASS")
          print("Drive API responded successfully. No file names or IDs were printed.")
          PY

      - name: Test Apps Script gateway health
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
        run: |
          if [ -z "$MMV2_GATEWAY_URL" ]; then
            echo "MMV2_GATEWAY_URL is missing."
            exit 1
          fi
          python - <<'PY'
          import os
          import requests

          response = requests.get(
              os.environ["MMV2_GATEWAY_URL"],
              params={"action": "health"},
              timeout=45,
          )
          if not response.ok:
              raise SystemExit(f"APPS_SCRIPT_GATEWAY: FAIL (HTTP {response.status_code})")

          try:
              data = response.json()
          except ValueError:
              raise SystemExit("APPS_SCRIPT_GATEWAY: FAIL (non-JSON response)")

          if not data.get("success") or data.get("status") != "OK":
              raise SystemExit("APPS_SCRIPT_GATEWAY: FAIL (unexpected health response)")

          print("APPS_SCRIPT_GATEWAY: PASS")
          print("Gateway version:", data.get("version", "not reported"))
          PY
