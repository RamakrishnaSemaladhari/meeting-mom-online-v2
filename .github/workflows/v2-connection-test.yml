name: V2 Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test existing V2 Google OAuth and Drive access
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.MMV2_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.MMV2_GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.MMV2_GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, sys

          required = ["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_REFRESH_TOKEN"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              print("MISSING_REQUIRED_V2_SECRETS:", ", ".join(missing))
              sys.exit(1)

          response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": os.environ["GOOGLE_CLIENT_ID"],
                  "client_secret": os.environ["GOOGLE_CLIENT_SECRET"],
                  "refresh_token": os.environ["GOOGLE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              },
              timeout=45,
          )
          if not response.ok:
              try:
                  body = response.json()
                  error = body.get("error", "unknown")
                  description = body.get("error_description", "No error description")
              except Exception:
                  error, description = "non_json_error", "Google returned a non-JSON error"
              print(f"GOOGLE_OAUTH: FAIL (HTTP {response.status_code}; {error}: {description})")
              sys.exit(1)

          access_token = response.json().get("access_token")
          if not access_token:
              print("GOOGLE_OAUTH: FAIL (no access token returned)")
              sys.exit(1)

          drive = requests.get(
              "https://www.googleapis.com/drive/v3/files",
              params={"pageSize": 1, "fields": "files(id,name,mimeType)"},
              headers={"Authorization": "Bearer " + access_token},
              timeout=45,
          )
          if not drive.ok:
              try:
                  detail = drive.json().get("error", {}).get("message", "Drive API request failed")
              except Exception:
                  detail = "Drive API returned a non-JSON error"
              print(f"GOOGLE_DRIVE_API: FAIL (HTTP {drive.status_code}; {detail})")
              sys.exit(1)

          print("GOOGLE_OAUTH: PASS")
          print("GOOGLE_DRIVE_API_READ: PASS")
          print("Drive API list request completed; sample entries:", len(drive.json().get("files", [])))
          PY

      - name: Test existing Apps Script gateway health
        env:
          MMV2_GATEWAY_URL: ${{ secrets.MMV2_GATEWAY_URL }}
        run: |
          if [ -z "$MMV2_GATEWAY_URL" ]; then
            echo "MISSING_REQUIRED_SECRET: MMV2_GATEWAY_URL"
            exit 1
          fi
          python - <<'PY'
          import os, requests, sys

          try:
              response = requests.get(
                  os.environ["MMV2_GATEWAY_URL"],
                  params={"action": "health"},
                  timeout=45,
              )
              response.raise_for_status()
              data = response.json()
          except Exception as exc:
              print("APPS_SCRIPT_GATEWAY: FAIL (" + str(exc)[:300] + ")")
              sys.exit(1)

          if not data.get("success") or data.get("status") != "OK":
              print("APPS_SCRIPT_GATEWAY: FAIL (unexpected health response)")
              sys.exit(1)

          print("APPS_SCRIPT_GATEWAY: PASS")
          print("Gateway status:", data.get("status"))
          print("Gateway version:", data.get("version", "not reported"))
          PY
