<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting MoM Online V2</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:18px;background:#f6f7f9}.card{background:#fff;padding:22px;border-radius:14px;margin:14px 0}input,button{padding:12px;border-radius:8px;border:1px solid #ccd2d8}pre{white-space:pre-wrap}</style></head><body><h1>Meeting MoM Online V2</h1><div class="card"><input id="g" style="width:80%" placeholder="Apps Script /exec URL"><button onclick="h()">Health</button></div><div class="card"><pre id="o">Ready.</pre></div><script>async function h(){const u=g.value.trim();if(!u)return;o.textContent=JSON.stringify(await (await fetch(u+'?action=health')).json(),null,2)}</script></body></html>
